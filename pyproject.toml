[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearsay"
version = "0.1.0"
description = "Evidence-grounded verification of inherited authorization claims in multi-agent delegation"
requires-python = ">=3.11"
dependencies = ["openai>=1.50.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# AuthorizationBench runtime: the benchmark's requirements-core.txt pins (at the pinned commit), plus what its
# services need on the host (jmespath; tzdata where the OS has no time-zone database, e.g. Windows).
authbench = ["fastapi==0.141.1", "fastmcp==3.4.7", "Flask==3.1.1", "litellm==1.102.0", "pydantic==2.13.4",
             "pypdf==6.19.0", "requests==2.34.2", "starlette==1.6.0", "uvicorn==0.53.0", "jmespath", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
