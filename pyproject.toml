[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearsay"
version = "0.1.0"
description = "Evidence-grounded verification of inherited authorization claims in multi-agent delegation"
requires-python = ">=3.11"
dependencies = ["openai>=1.50.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
